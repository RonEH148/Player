name: Build Gamma Player

on:
  push:
    branches: [master]
    paths: ['url-v*.zip', '.github/workflows/build-url.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Apply newest Gamma Player changes
        run: |
          ZIP=$(ls url-v*.zip | sort -V | tail -1)
          echo "Using $ZIP"
          unzip -o "$ZIP" -d .

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Build (tablet + TV)
        run: bash tools/ci.sh

      - uses: actions/upload-artifact@v4
        with:
          name: GammaPlayer-Tablet
          path: out/*-Tablet.apk

      - uses: actions/upload-artifact@v4
        with:
          name: GammaPlayer-TV
          path: out/*-TV.apk

      - name: Publish for in-app updates
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/release.sh
