name: Build Gamma Player

on:
  push:
    branches: [master]
    paths: ['url-v*.zip', '.github/workflows/build-url.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Apply newest Gamma Player changes
        run: |
          ZIP=$(ls url-v*.zip | sort -V | tail -1)
          echo "Using $ZIP"
          unzip -o "$ZIP" -d .

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Signing key (from GitHub Secrets)
        env:
          KS_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          if [ -z "$KS_B64" ]; then echo "::error::Secret SIGNING_KEYSTORE_B64 is missing"; exit 1; fi
          echo "$KS_B64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          cp "$RUNNER_TEMP/release.jks" url.keystore
          sed -i -E "s/storePassword \"[^\"]*\"/storePassword \"$SIGNING_PASSWORD\"/; s/keyPassword \"[^\"]*\"/keyPassword \"$SIGNING_PASSWORD\"/; s/keyAlias \"[^\"]*\"/keyAlias \"release\"/" app/build.gradle

      - name: Build (tablet + TV)
        run: bash tools/ci.sh

      - uses: actions/upload-artifact@v4
        with:
          name: GammaPlayer-Tablet
          path: out/*-Tablet.apk

      - uses: actions/upload-artifact@v4
        with:
          name: GammaPlayer-TV
          path: out/*-TV.apk

      - name: Publish for in-app updates
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/release.sh
