name: Build SofaBrowse
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '21', distribution: 'temurin' }
      - name: Build APKs
        run: |
          unzip -q sofabrowse-source.zip -d src
          cd src/sofabrowse && chmod +x gradlew
          ./gradlew assembleFossGeckoExcludedRelease
          ./gradlew assembleFossGeckoIncludedRelease -PenableAbiSplits
          mkdir -p ../../out
          cp app/build/outputs/apk/fossGeckoExcluded/release/*.apk ../../out/SofaBrowse-webview.apk
          for f in app/build/outputs/apk/fossGeckoIncluded/release/*.apk; do
            abi=$(basename "$f" | sed -E 's/.*(armeabi-v7a|arm64-v8a|x86_64).*/\1/')
            cp "$f" "../../out/SofaBrowse-with-firefox-engine-$abi.apk"
          done
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: SofaBrowse build ${{ github.run_number }}
          files: out/*.apk
